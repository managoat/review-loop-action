name: Test Action
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - run: node --test index.test.cjs
  public-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      # Exercise public resolution, action.yml, Node 24 and the real entrypoint.
      # Invalid input must fail before requesting OIDC or starting paid work.
      - uses: managoat/review-loop-action@11e340fbef52e7da8482bbf870ad52d8613a9d2f
        id: dispatch
        continue-on-error: true
        with:
          service-url: http://invalid.example
      - name: Confirm the entrypoint rejected invalid input
        if: always()
        env:
          OUTCOME: ${{ steps.dispatch.outcome }}
        run: test "$OUTCOME" = failure
